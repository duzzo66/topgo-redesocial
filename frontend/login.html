<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar · Entre Nós</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="login-screen" id="loginScreen">
      <div class="login-card">
        <div class="login-symbol">♥</div>
        <h1>Entre Nós</h1>
        <p>Um cantinho só nosso.</p>
        <form id="loginForm">
          <label for="username">Usuário</label>
          <input id="username" type="text" placeholder="dressa ou tsukii" autocomplete="username" required />
          <label for="password">Senha</label>
          <input id="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required />
          <button type="submit">Entrar <span>→</span></button>
          <small class="login-error" id="loginError"></small>
        </form>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
